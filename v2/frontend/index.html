<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Postal v2 Demo</title>
    <style>
      body { font-family: system-ui, Arial; max-width: 680px; margin: 32px auto; }
      label { display:block; margin-top: 12px; }
      input, textarea { width:100%; padding:8px; margin-top:4px }
      button { margin-top: 12px; padding: 8px 12px }
      pre { background:#f6f6f6; padding:12px }
    </style>
  </head>
  <body>
    <h1>Postal v2 - Send Demo</h1>
    <form id="send">
      <label>From<input name="from" value="sender@example.com" /></label>
      <label>To<input name="to" value="recipient@example.com" /></label>
      <label>Subject<input name="subject" value="Hello from Postal v2" /></label>
      <label>Body<textarea name="body">This is a demo email body.</textarea></label>
      <button type="submit">Send</button>
    </form>

    <h2>Result</h2>
    <pre id="result">(no attempts yet)</pre>

    <script>
      const form = document.getElementById('send');
      const result = document.getElementById('result');
      form.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const fd = new FormData(form);
        const body = Object.fromEntries(fd.entries());
        result.textContent = 'sending...';
        try {
          const res = await fetch('/api/v2/send', { method: 'POST', body: JSON.stringify(body), headers: { 'Content-Type': 'application/json' } });
          const json = await res.json();
          result.textContent = `status=${res.status}\n` + JSON.stringify(json, null, 2);
        } catch (err) {
          result.textContent = 'network error: ' + err;
        }
      });
    </script>
  </body>
</html>
