name: Preview build (artifact)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare artifact
        run: |
          mkdir -p preview_artifact
          if [ -d "pages" ]; then cp -r pages preview_artifact/pages; fi
          if [ -d "workers" ]; then cp -r workers preview_artifact/workers; fi
          if [ -f "index.js" ]; then cp index.js preview_artifact/index.js; fi
          if [ -f "wrangler.toml" ]; then cp wrangler.toml preview_artifact/wrangler.toml; fi
          tar -czf postal-preview.tar.gz -C preview_artifact .

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: postal-preview
          path: postal-preview.tar.gz
