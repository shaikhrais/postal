name: Deploy to Cloudflare

on:
  push:
    branches: [ main, scaffold/cloudflare-poc ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Check required secrets
        if: ${{ !secrets.CLOUDFLARE_API_TOKEN || !secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID. Set repository secrets to publish."
          exit 1

      - name: Publish to Cloudflare
        run: |
          wrangler whoami
          wrangler publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELAY_API_KEY: ${{ secrets.RELAY_API_KEY }}
